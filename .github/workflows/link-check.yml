name: Link check | 死链巡检
# 本仓的内容即链接，死链是唯一确定的腐烂方式。
# 两种触发：PR 时全量检查（红了就是 PR 引入或恰好有旧链腐烂，周巡检平时兜底保持 main 干净）；
# 每周定时巡检 + 手动触发。检查不设为必需状态——红色信号交给 reviewer 判断，不硬拦合并。
on:
  pull_request:
    paths:
      - "**.md"
  schedule:
    - cron: "17 2 * * 1"   # 每周一 10:17 北京时间
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # 202/403 can be anti-bot responses, not missing pages; 404 still fails and timeouts stay visible.
          args: --verbose --no-progress --retry-wait-time 5 --max-retries 3 --timeout 60 --accept 200,202,204,206,403 './**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
